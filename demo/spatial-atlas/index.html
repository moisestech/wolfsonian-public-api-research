<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Spatial Atlas</title>
  <link rel="stylesheet" href="./atlas.css">
</head>
<body>
<a class="skip" href="#stage">Skip to the map</a>
<header class="bar">
  <a class="mark" href="../archive-society/" aria-label="Conversational Atlas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </a>
  <h1>Spatial Atlas</h1>
  <div class="layers" role="radiogroup" aria-label="Matrix layer">
    <button type="button" role="radio" data-layer="geography" aria-checked="false">Place</button>
    <button type="button" role="radio" data-layer="objectType" aria-checked="false">Type</button>
    <button type="button" role="radio" data-layer="style" aria-checked="false">Look</button>
    <button type="button" role="radio" data-layer="theme" aria-checked="true">Theme</button>
    <button type="button" role="radio" data-layer="motif" aria-checked="false">Symbol</button>
  </div>
  <p id="count" class="count"></p>
  <a class="mark" href="../object-lens/" aria-label="Object Lens">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.6"/></svg>
  </a>
</header>
<div id="legend" class="legend" aria-label="Concepts in this layer"></div>
<main>
  <div id="stage" role="img" aria-label="Matrix objects in a force graph"></div>
  <aside id="card" aria-live="polite" hidden></aside>
</main>
<footer class="dock">
  <div class="stops" role="group" aria-label="Zoom stops">
    <button type="button" data-stop="0">World</button>
    <button type="button" data-stop="34">Region</button>
    <button type="button" data-stop="67">Street</button>
    <button type="button" data-stop="100">Object</button>
  </div>
  <input id="zoom" type="range" min="0" max="100" value="0" aria-label="Zoom">
  <a class="about" href="../about/">About</a>
</footer>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/","three-forcegraph":"/demo/vendor/three-forcegraph.mjs","d3-force-3d":"/demo/vendor/d3-force-3d.mjs"}}
</script>
<script type="module" src="./atlas.mjs"></script>
</body>
</html>
