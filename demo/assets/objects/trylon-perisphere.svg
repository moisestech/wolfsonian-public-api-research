<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="title-trylon">
  <title id="title-trylon">Original diagram of Trylon and Perisphere</title>
  <defs>
    <linearGradient id="sphereGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7e2e6"/>
      <stop offset="100%" stop-color="#8fa3ab"/>
    </linearGradient>
  </defs>
  <rect width="240" height="200" fill="none"/>
  <line class="guide" x1="28" y1="172" x2="212" y2="172" stroke="#9aa7ae" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon class="trylon" points="78,28 96,172 60,172" fill="#1c2429" opacity="0.92"/>
  <circle class="perisphere" cx="148" cy="118" r="46" fill="url(#sphereGrad)" stroke="#1c2429" stroke-width="1.5"/>
  <path class="helicline" d="M118 140 C128 128, 138 122, 152 118" fill="none" stroke="#0b5f6b" stroke-width="2"/>
  <circle cx="152" cy="118" r="3" fill="#0b5f6b"/>
</svg>
