height="83" rx="2" fill="#A6E2C6"/><rect x="555" y="813" width="490" height="83" rx="16" fill="#1A2627" stroke="#4B625A"/><rect x="555" y="813" width="5" height="83" rx="2" fill="#A7C8DB"/><rect x="1075" y="813" width="490" height="83" rx="16" fill="#1A2627" stroke="#4B625A"/><rect x="1075" y="813" width="5" height="83" rx="2" fill="#E1B68A"/><text x="57" y="156" fill="#A6E2C6" font-size="15" font-weight="700" letter-spacing="1.2">SOURCE 01</text><text x="57" y="189" fill="#F3F1E9" font-size="25" font-weight="700">Lakehouse API</text><text x="57" y="213" fill="#A7BAB4" font-size="17">Authorized read-only JSON + catalog fields</text><text x="577" y="156" fill="#A7C8DB" font-size="15" font-weight="700" letter-spacing="1.2">SOURCE 02</text><text x="577" y="189" fill="#F3F1E9" font-size="25" font-weight="700">Public record packets</text><text x="577" y="213" fill="#A7BAB4" font-size="17">Cited, curated + rights-checked</text><text x="1097" y="156" fill="#E1B68A" font-size="15" font-weight="700" letter-spacing="1.2">SOURCE 03</text><text x="1097" y="189" fill="#F3F1E9" font-size="25" font-weight="700">301-object staff matrix</text><text x="1097" y="213" fill="#A7BAB4" font-size="17">Private taxonomy + accessions</text><text x="60" y="317" font-size="18" fill="#A6E2C6" font-weight="700">IDENTITY / PROVENANCE / RIGHTS</text><text x="60" y="346" font-size="22" fill="#F3F1E9">Accession normalization · field lineage · ambiguity · visibility allowlist · verified retrieval contract</text><text x="57" y="442" fill="#A6E2C6" font-size="15" font-weight="700" letter-spacing="1.2">01 · ID</text><text x="57" y="475" fill="#F3F1E9" font-size="25" font-weight="700">Exact accessions</text><text x="57" y="499" fill="#A7BAB4" font-size="17">Title + creator</text><text x="372" y="442" fill="#A7C8DB" font-size="15" font-weight="700" letter-spacing="1.2">02 · TEXT</text><text x="372" y="475" fill="#F3F1E9" font-size="25" font-weight="700">Words / Subject</text><text x="372" y="499" fill="#A7BAB4" font-size="17">Literal + synonyms</text><text x="687" y="442" fill="#A6E2C6" font-size="15" font-weight="700" letter-spacing="1.2">03 · TAXONOMY</text><text x="687" y="475" fill="#F3F1E9" font-size="25" font-weight="700">Themes + motifs</text><text x="687" y="499" fill="#A7BAB4" font-size="17">Private namespaces</text><text x="1002" y="442" fill="#E1B68A" font-size="15" font-weight="700" letter-spacing="1.2">04 · MEANING</text><text x="1002" y="475" fill="#F3F1E9" font-size="25" font-weight="700">Semantic vectors</text><text x="1002" y="499" fill="#A7BAB4" font-size="17">Only approved text</text><text x="1317" y="442" fill="#A6E2C6" font-size="15" font-weight="700" letter-spacing="1.2">05 · CRITIQUE</text><text x="1317" y="475" fill="#F3F1E9" font-size="25" font-weight="700">Artist tension</text><text x="1317" y="499" fill="#A7BAB4" font-size="17">Explicitly proposed</text><text x="60" y="598" font-size="15" font-weight="700" fill="#A6E2C6">ARTIST-AUTHORED DISCOVERY LENSES · ARBITRARY SEARCH ALWAYS AVAILABLE</text><text x="60" y="633" font-size="27" font-weight="700" fill="#F3F1E9">Archive</text><text x="300" y="633" font-size="27" font-weight="700" fill="#F3F1E9">Dream</text><text x="525" y="633" font-size="27" font-weight="700" fill="#F3F1E9">Brain</text><text x="770" y="633" font-size="18" fill="#A7BAB4">Every permitted object remains searchable, even without a conversation.</text><text x="60" y="718" font-size="15" fill="#E1B68A" font-weight="700">THE EVIDENTIARY THRESHOLD</text><text x="60" y="751" font-size="26" fill="#F3F1E9" font-weight="700">Why proposed?</text><text x="390" y="751" font-size="26" fill="#F3F1E9" font-weight="700">Which field?</text><text x="705" y="751" font-size="26" fill="#F3F1E9" font-weight="700">Fact or inference?</text><text x="1130" y="751" font-size="26" fill="#F3F1E9" font-weight="700">Who approved?</text><text x="57" y="839" fill="#A6E2C6" font-size="15" font-weight="700" letter-spacing="1.2">OUTPUT A</text><text x="57" y="872" fill="#F3F1E9" font-size="25" font-weight="700">Spatial graph</text><text x="57" y="896" fill="#A7BAB4" font-size="17">Clusters + all allowed nodes</text><text x="577" y="839" fill="#A7C8DB" font-size="15" font-weight="700" letter-spacing="1.2">OUTPUT B</text><text x="577" y="872" fill="#F3F1E9" font-size="25" font-weight="700">Questions + discovery</text><text x="577" y="896" fill="#A7BAB4" font-size="17">4–6 explained links per focus</text><text x="1097" y="839" fill="#E1B68A" font-size="15" font-weight="700" letter-spacing="1.2">OUTPUT C</text><text x="1097" y="872" fill="#F3F1E9" font-size="25" font-weight="700">Authored rooms + records</text><text x="1097" y="896" fill="#A7BAB4" font-size="17">Scripted speech + inspect source</text><text x="35" y="925" fill="#A7BAB4" font-size="14" letter-spacing=".8">OBJECTS MAY BE SILENT. CONNECTIONS MAY BE PROPOSED. RECORD FACTS REMAIN INSPECTABLE.</text></g></svg>