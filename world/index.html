<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="World 0.1A — Sparton two-reader encounter. Experimental; not the institutional Research Demo 001.">
  <title>World 0.1A — Sparton encounter</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#hud">Skip to stage controls</a>

  <aside class="research-note">
    Experimental world · same research data as
    <a href="../demo/">Research Demo 001</a>
  </aside>

  <header class="hud" id="hud">
    <p class="hud__where"><span class="hud__kicker">Surface</span> <strong id="stage-name">WORLD</strong></p>
    <p class="hud__language"><span class="hud__kicker">Language</span> <strong id="language-kind">LABEL</strong></p>
    <p class="hud__hint" id="stage-hint" aria-live="polite"></p>
  </header>

  <main class="stage-root">
    <div id="world-canvas" class="world-canvas" aria-label="Living simulation world"></div>
    <p class="world-caption" id="world-caption">SPARTON RADIO · 1937</p>
  </main>

  <div id="overlays" class="overlays" hidden></div>

  <nav class="stage-nav" aria-label="Stage navigation">
    <button type="button" class="text-button" id="back-btn" hidden>← Back</button>
    <button type="button" class="text-button" id="restart-btn">Restart</button>
  </nav>

  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
