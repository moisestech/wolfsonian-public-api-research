name: Discovery Lab checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'demo/discovery-lab/**'
      - 'demo/archive-society/**'
      - 'src/discovery-*.mjs'
      - 'src/archive-*.mjs'
      - 'src/curated-edge-scenes.mjs'
      - 'src/conversation-orientation.mjs'
      - 'src/scene-performance.mjs'
      - 'src/persona-sigils.mjs'
      - 'demo/persona-sigils/**'
      - 'docs/design/**'
      - 'test/persona-sigils.test.mjs'
      - 'test/scene-performance.test.mjs'
      - 'server/archive-*.mjs'
      - 'api/archive-society/**'
      - 'scripts/*society*'
      - 'test/archive-*.test.mjs'
      - 'test/curated-edge-scenes.test.mjs'
      - 'test/conversation-ux.test.mjs'
      - 'test/atlas-four-control-header.test.mjs'
      - 'test/conversation-orientation.test.mjs'
      - 'test/cold-visitor-orientation.test.mjs'
      - 'examples/archive-society*'
      - 'test/discovery-*.test.mjs'
      - '.github/workflows/discovery-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check src/discovery-graph.mjs
          node --check src/discovery-personas.mjs
          node --check src/discovery-dialogue.mjs
          node --check demo/discovery-lab/showcase.mjs
          node --check demo/archive-society/society.mjs
          node --check demo/archive-society/editorial-headline.mjs
          node --check src/archive-society.mjs
          node --check src/curated-edge-scenes.mjs
          node --check src/conversation-orientation.mjs
          node --check src/scene-performance.mjs
          node --check src/persona-sigils.mjs
          node --check src/archive-evidence.mjs
          node --check server/archive-services.mjs
          node --check scripts/serve-archive-society.mjs
          node --check scripts/check-society-browser.mjs
      - name: Run discovery and persona asset tests
        run: node --test test/discovery-graph.test.mjs test/discovery-showcase.test.mjs test/persona-sigils.test.mjs
      - name: Run archive society and service tests
        run: |
          npm run test:society
          node --test test/cold-visitor-orientation.test.mjs
          node --test test/editorial-headline.test.mjs
          node --test test/atlas-four-control-header.test.mjs
      - name: Verify curated relationships and skeptical fallbacks
        run: node --test test/curated-edge-scenes.test.mjs test/conversation-ux.test.mjs test/conversation-orientation.test.mjs test/scene-performance.test.mjs
      - name: Browser smoke and screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node test/discovery-browser-smoke.mjs
          node scripts/check-society-browser.mjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-lab-review
          path: |
            artifacts/discovery-lab-*.png
            artifacts/archive-society-*.png
          if-no-files-found: ignore
      - name: Ensure private matrix is not present in tracked files
        run: |
          if git ls-files | grep -Ei '(object.at.scale.*\.(csv|xlsx)|content.matrix.*\.(csv|xlsx))'; then
            echo 'Museum working matrix must not be in the repository.' >&2
            exit 1
          fi
          test -f demo/discovery-lab/index.html
          test -f demo/discovery-lab/showcase.css
