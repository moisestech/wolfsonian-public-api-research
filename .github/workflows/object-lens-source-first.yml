name: Object Lens source-first contract
on:
  pull_request:
    paths:
      - "src/object-lens-core.mjs"
      - "src/machine-age-research.mjs"
      - "src/machine-age-primary-leads.mjs"
      - "demo/object-lens/**"
      - "demo/archive-society/society.mjs"
      - "scripts/serve-archive-society.mjs"
      - "test/object-lens-core.test.mjs"
      - "test/machine-age-research.test.mjs"
      - "test/machine-age-primary-leads.test.mjs"
      - "scripts/check-object-lens-browser.mjs"
      - ".github/workflows/object-lens-source-first.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check src/object-lens-core.mjs
          node --check src/machine-age-research.mjs
          node --check src/machine-age-primary-leads.mjs
          node --check demo/object-lens/lens.mjs
          node --check demo/archive-society/society.mjs
          node --check scripts/serve-archive-society.mjs
      - name: Verify source-first visitor contract
        run: node --test test/object-lens-core.test.mjs test/machine-age-research.test.mjs test/machine-age-primary-leads.test.mjs

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test phone encounter and Atlas handoff in Chromium
        run: node scripts/check-object-lens-browser.mjs
      - name: Upload source-first phone screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-lens-mobile
          path: artifacts/object-lens-mobile.png
          if-no-files-found: ignore
