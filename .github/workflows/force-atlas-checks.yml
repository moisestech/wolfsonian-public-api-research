name: Force Atlas evidence/contract checks
on:
  pull_request:
    paths:
      - 'src/force-atlas-data.mjs'
      - 'demo/spatial-atlas/force/**'
      - 'demo/spatial-atlas/index.html'
      - 'scripts/serve-archive-society.mjs'
      - 'test/force-atlas-data.test.mjs'
      - '.github/workflows/force-atlas-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/force-atlas-data.mjs
          node --check demo/spatial-atlas/force/force.mjs
          node --check scripts/serve-archive-society.mjs
      - name: Source contract tests (never access Lakehouse)
        run: node --test test/force-atlas-data.test.mjs test/atlas-graph.test.mjs
      - name: Guard against restricted content accidentally included
        run: |
          test -f demo/spatial-atlas/force/index.html
          if git diff --name-only "${{ github.event.pull_request.base.sha || 'HEAD~1' }}" HEAD | grep -Ei '(Object at Scale.*\.(csv|xlsx)|\.env\.local)'; then
            echo "Restricted research input must not enter this PR" >&2
            exit 1
          fi
